name: Build, Push & Update GitOps

on:
  push:
    branches: [ "main" ]
    paths:
      - "app/**"

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cicd-demo-app:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/cicd-demo-app:latest

      - name: Update image tag in Helm values.yaml
        run: |
          sed -i 's|tag: .*|tag: "${{ github.sha }}"|' helm-chart/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm-chart/values.yaml
          git commit -m "Update image tag to ${{ github.sha }} [skip ci]"
          git push
